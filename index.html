<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphEtch – Messages etched in the chain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23FF5D51'/><path d='M34 70L58 22l8 4-24 48z' fill='%230F1B2D'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem('alphetch-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){}</script>
<style>
:root{--paper:#E8EBF0;--card:#F5F6F8;--fg:#0F1B2D;--panel:#0F1B2D;--panel2:#1A2A43;--pline:#2D4163;--btnbg:#0F1B2D;--btnfg:#fff;--slate:#5A6679;--line:#CBD1DB;--wax:#FF5D51;--ok:#1F8A5B;
--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;color-scheme:light}
:root[data-theme=dark]{--paper:#0B121D;--card:#121C2B;--fg:#E6EAF1;--panel:#17243A;--panel2:#0F1A2C;--pline:#2A3B58;--btnbg:#E6EAF1;--btnfg:#0B121D;--slate:#93A0B5;--line:#24324A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--fg);font:400 16px/1.55 var(--sans)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1120px;margin:0 auto;padding:22px 20px}
.brand{display:flex;align-items:center;gap:12px;font:800 28px/1 var(--serif);letter-spacing:-.02em}
.seal{width:34px;height:34px;border-radius:50%;background:var(--wax);display:grid;place-items:center}
.seal svg{width:16px;height:20px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--fg)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--btnbg);color:var(--btnfg)}
.icon{background:var(--card);color:var(--fg);border:1px solid var(--line);width:42px;padding:9px 0;font-size:18px;line-height:1}
.btn.wax{background:var(--wax);color:#1a0a08;padding:14px 22px;width:100%;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--wax);outline-offset:2px}
.hero{max-width:1120px;margin:8px auto 26px;padding:0 20px}
h1{font:800 clamp(34px,6vw,64px)/1.02 var(--serif);letter-spacing:-.03em;margin:0 0 12px;max-width:14em}
.slogan{font:italic 600 24px/1.2 var(--serif);color:var(--wax)!important;margin:0 0 14px!important}
.hero p{max-width:40em;color:var(--slate);margin:0}
main{max-width:1120px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.composer{background:var(--panel);color:#E9EEF6;border-radius:22px;padding:24px;position:sticky;top:16px}
@media (max-width:860px){.composer{position:static}}
.composer h2,.hist h2{font:600 22px/1.2 var(--serif);margin:0 0 16px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
textarea{width:100%;background:var(--panel2);border:1px solid var(--pline);border-radius:12px;padding:12px;color:#fff;resize:vertical;min-height:84px}
textarea::placeholder{color:#7F8EA8}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#9FB0CB;margin-top:6px}
.meta .bad{color:var(--wax);font-weight:700}
.note{font-size:13px;color:#9FB0CB;margin:14px 0}
#status{margin-top:14px;font-size:14px;min-height:1.4em}
#status.err{color:#FFB0AA}#status.ok{color:#7BE0AF}
#status a{color:inherit}
.hist{min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:700;color:var(--slate)}
.tab[aria-selected=true]{background:var(--btnbg);border-color:var(--btnbg);color:var(--btnfg)}
.tabs .btn{margin-left:auto;background:transparent;color:var(--slate);border:1px solid var(--line);padding:7px 14px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--slate);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.item.in{border-left-color:var(--ok)}.item.out{border-left-color:var(--wax)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--slate)}
.top b{font-weight:700}
.txt{font:400 19px/1.45 var(--serif);margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.item a{font-size:13px;color:var(--slate)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--slate)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="seal"><svg viewBox="0 0 16 20"><path d="M3 18L10 1l3 1.2L6 19z" fill="#0F1B2D"/></svg></span>AlphEtch</div>
  <div class="bar">
    <select id="lang" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="de">DE</option><option value="es">ES</option></select>
    <button class="btn icon" id="theme" aria-label="Theme" title="Light / Dark">☾</button>
    <select id="net" aria-label="Network"><option value="mainnet">Mainnet</option><option value="testnet" data-i="netTest"></option></select>
    <button class="btn" id="connect"></button>
  </div>
</header>

<section class="hero">
  <h1 data-i="h1"></h1>
  <p class="slogan">Messages etched in the chain.</p>
  <p data-i="heroP"></p>
</section>

<main>
  <section class="composer" aria-labelledby="ct">
    <h2 id="ct" data-i="ct"></h2>
    <label for="to" data-i="toL"></label>
    <textarea id="to" rows="3" placeholder="1Abc…&#10;1Def…" spellcheck="false"></textarea>
    <div class="meta"><span id="cnt"></span></div>
    <label for="msg" data-i="msgL"></label>
    <textarea id="msg" rows="4" data-ph="msgPh"></textarea>
    <div class="meta"><span id="bytes"></span><span data-i="pub"></span></div>
    <p class="note" data-i="note"></p>
    <button class="btn wax" id="send" disabled data-i="send"></button>
    <div id="status" role="status"></div>
  </section>

  <section class="hist" aria-labelledby="ht">
    <h2 id="ht" data-i="ht"></h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-f="all" aria-selected="true" data-i="all"></button>
      <button class="tab" role="tab" data-f="in" aria-selected="false" data-i="inn"></button>
      <button class="tab" role="tab" data-f="out" aria-selected="false" data-i="out"></button>
      <button class="btn" id="refresh" disabled data-i="refresh"></button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
const T={
en:{netTest:'Testnet (practice)',connect:'Connect wallet',h1:'Write once. Etched forever.',heroP:'Send a public message to one or more Alephium addresses. It is written into the blockchain: nobody can erase or edit it.',ct:'New message',toL:'Recipients (one address per line)',msgL:'Message',msgPh:'Your public message…',pub:'Plain text, readable by anyone',note:'Each recipient receives 0.001 ALPH along with the message. You also pay the network fee (gas) from your wallet.',send:'Etch the message',ht:'History',all:'All',inn:'Received',out:'Sent',refresh:'Refresh',emptyC:'Connect your wallet to see your sent and received messages.',emptyN:'No messages yet.',loading:'Loading history…',loadErr:'Could not load history: ',from:'Received from ',to:'Sent to ',expl:'View on explorer',install:'Install the Alephium extension',installAfter:' then reload the page.',connFail:'Connection refused or failed: ',confirm:'Confirm the transaction in your wallet…',sentOk:'Message sent. ',viewTx:'View transaction',sendFail:'Could not send: ',rOne:' recipient',rMany:' recipients',inv:' · {n} invalid address(es)',bytes:' bytes'},
fr:{netTest:'Testnet (essai)',connect:'Connecter mon wallet',h1:'Écris une fois. Gravé pour toujours.',heroP:'Envoie un message public à une ou plusieurs adresses Alephium. Il est inscrit dans la blockchain : personne ne peut l’effacer ni le modifier.',ct:'Nouveau message',toL:'Destinataires (une adresse par ligne)',msgL:'Message',msgPh:'Ton message public…',pub:'Texte en clair, lisible par tous',note:'Chaque destinataire reçoit 0,001 ALPH avec le message. Tu paies aussi les frais de réseau (gas) depuis ton wallet.',send:'Graver le message',ht:'Historique',all:'Tous',inn:'Reçus',out:'Envoyés',refresh:'Actualiser',emptyC:'Connecte ton wallet pour voir tes messages envoyés et reçus.',emptyN:'Aucun message pour l’instant.',loading:'Chargement de l’historique…',loadErr:'Impossible de charger l’historique : ',from:'Reçu de ',to:'Envoyé à ',expl:'Voir sur l’explorateur',install:'Installe l’extension Alephium',installAfter:' puis recharge la page.',connFail:'Connexion refusée ou impossible : ',confirm:'Confirme la transaction dans ton wallet…',sentOk:'Message envoyé. ',viewTx:'Voir la transaction',sendFail:'Envoi impossible : ',rOne:' destinataire',rMany:' destinataires',inv:' · {n} adresse(s) invalide(s)',bytes:' octets'},
de:{netTest:'Testnet (Probe)',connect:'Wallet verbinden',h1:'Einmal schreiben. Für immer eingraviert.',heroP:'Sende eine öffentliche Nachricht an eine oder mehrere Alephium-Adressen. Sie wird in der Blockchain gespeichert: Niemand kann sie löschen oder ändern.',ct:'Neue Nachricht',toL:'Empfänger (eine Adresse pro Zeile)',msgL:'Nachricht',msgPh:'Deine öffentliche Nachricht…',pub:'Klartext, für alle lesbar',note:'Jeder Empfänger erhält 0,001 ALPH zusammen mit der Nachricht. Die Netzwerkgebühr (Gas) zahlst du aus deinem Wallet.',send:'Nachricht eingravieren',ht:'Verlauf',all:'Alle',inn:'Empfangen',out:'Gesendet',refresh:'Aktualisieren',emptyC:'Verbinde dein Wallet, um gesendete und empfangene Nachrichten zu sehen.',emptyN:'Noch keine Nachrichten.',loading:'Verlauf wird geladen…',loadErr:'Verlauf konnte nicht geladen werden: ',from:'Empfangen von ',to:'Gesendet an ',expl:'Im Explorer ansehen',install:'Installiere die Alephium-Erweiterung',installAfter:' und lade die Seite neu.',connFail:'Verbindung abgelehnt oder fehlgeschlagen: ',confirm:'Bestätige die Transaktion in deinem Wallet…',sentOk:'Nachricht gesendet. ',viewTx:'Transaktion ansehen',sendFail:'Senden nicht möglich: ',rOne:' Empfänger',rMany:' Empfänger',inv:' · {n} ungültige Adresse(n)',bytes:' Bytes'},
es:{netTest:'Testnet (prueba)',connect:'Conectar wallet',h1:'Escribe una vez. Grabado para siempre.',heroP:'Envía un mensaje público a una o varias direcciones Alephium. Queda inscrito en la blockchain: nadie puede borrarlo ni modificarlo.',ct:'Nuevo mensaje',toL:'Destinatarios (una dirección por línea)',msgL:'Mensaje',msgPh:'Tu mensaje público…',pub:'Texto plano, legible por todos',note:'Cada destinatario recibe 0,001 ALPH junto con el mensaje. Tú pagas además la comisión de red (gas) desde tu wallet.',send:'Grabar el mensaje',ht:'Historial',all:'Todos',inn:'Recibidos',out:'Enviados',refresh:'Actualizar',emptyC:'Conecta tu wallet para ver tus mensajes enviados y recibidos.',emptyN:'Aún no hay mensajes.',loading:'Cargando historial…',loadErr:'No se pudo cargar el historial: ',from:'Recibido de ',to:'Enviado a ',expl:'Ver en el explorador',install:'Instala la extensión de Alephium',installAfter:' y recarga la página.',connFail:'Conexión rechazada o fallida: ',confirm:'Confirma la transacción en tu wallet…',sentOk:'Mensaje enviado. ',viewTx:'Ver la transacción',sendFail:'No se pudo enviar: ',rOne:' destinatario',rMany:' destinatarios',inv:' · {n} dirección(es) no válida(s)',bytes:' bytes'}};
const LOC={en:'en-GB',fr:'fr-FR',de:'de-DE',es:'es-ES'};
const API={mainnet:'https://backend.mainnet.alephium.org',testnet:'https://backend.testnet.alephium.org'};
const EXP={mainnet:'https://explorer.alephium.org',testnet:'https://testnet.alephium.org'};
const DUST='1000000000000000',MAX=200;
const $=id=>document.getElementById(id);
let wallet=null,acct=null,items=[],filter='all',lang='en',loadErr='';
try{lang=localStorage.getItem('alphetch-lang')||'en'}catch(e){}
if(!T[lang])lang='en';
const t=k=>T[lang][k];

const short=a=>a.slice(0,6)+'…'+a.slice(-5);
const toHex=s=>[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
function fromHex(h){try{const b=new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch{return null}}
const bytes=s=>new TextEncoder().encode(s).length;
const isAddr=a=>/^[1-9A-HJ-NP-Za-km-z]{30,60}$/.test(a);
const recips=()=>[...new Set($('to').value.split(/[\s,;]+/).filter(Boolean))];
function say(x,c){const s=$('status');s.className=c||'';s.innerHTML='';if(x instanceof Node)s.append(x);else s.textContent=x}

function applyLang(){
  document.documentElement.lang=lang;$('lang').value=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('connect').textContent=acct?short(acct.address):t('connect');
  refreshForm();render();
}
$('lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('alphetch-lang',lang)}catch(x){}applyLang()};

function setTheme(v){document.documentElement.dataset.theme=v;$('theme').textContent=v==='dark'?'☀':'☾';try{localStorage.setItem('alphetch-theme',v)}catch(e){}}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme);

function refreshForm(){
  const r=recips(),n=bytes($('msg').value),bad=r.filter(a=>!isAddr(a));
  $('cnt').textContent=r.length+(r.length>1?t('rMany'):t('rOne'))+(bad.length?t('inv').replace('{n}',bad.length):'');
  $('bytes').textContent=n+' / '+MAX+t('bytes');$('bytes').className=n>MAX?'bad':'';
  $('send').disabled=!(acct&&r.length&&!bad.length&&n>0&&n<=MAX);
}
$('to').oninput=$('msg').oninput=refreshForm;

async function connect(){
  const w=window.alephiumProviders&&window.alephiumProviders.alephium;
  if(!w){const a=document.createElement('a');a.href='https://chrome.google.com/webstore/detail/alephium-extension-wallet';a.target='_blank';a.rel='noopener';a.textContent=t('install');
    const f=document.createElement('span');f.append(a,t('installAfter'));say(f,'err');return}
  try{
    acct=await w.unsafeEnable({networkId:$('net').value,onDisconnected:()=>reset()});
    wallet=w;$('connect').textContent=short(acct.address);$('refresh').disabled=false;
    say('');refreshForm();load();
  }catch(e){say(t('connFail')+(e.message||e),'err')}
}
function reset(){wallet=acct=null;items=[];loadErr='';$('connect').textContent=t('connect');$('refresh').disabled=true;refreshForm();render()}
$('connect').onclick=()=>acct?reset():connect();
$('net').onchange=()=>{if(acct)reset()};

async function load(){
  const net=$('net').value,me=acct.address;let all=[];loadErr='';
  $('list').innerHTML='';const ld=document.createElement('div');ld.className='empty';ld.textContent=t('loading');$('list').append(ld);
  try{
    for(let p=1;p<=40;p++){
      const r=await fetch(API[net]+'/addresses/'+me+'/transactions?page='+p+'&limit=100');
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();all=all.concat(j);if(j.length<100)break;
    }
  }catch(e){loadErr=e.message;items=[];render();return}
  const out=[];
  for(const tx of all){
    const from=tx.inputs&&tx.inputs[0]&&tx.inputs[0].address,groups={};
    for(const o of tx.outputs||[]){
      const raw=o.message||o.additionalData;if(!raw)continue;const text=fromHex(raw);if(!text||!text.trim())continue;
      if(from===me){(groups[text]=groups[text]||[]).push(o.address)}
      else if(o.address===me){out.push({dir:'in',peers:[from||'?'],text,tx:tx.hash,ts:tx.timestamp})}
    }
    for(const text in groups){const peers=[...new Set(groups[text])];out.push({dir:'out',peers,text,tx:tx.hash,ts:tx.timestamp})}
  }
  items=out.sort((a,b)=>b.ts-a.ts);render();
}

function render(){
  const L=$('list');L.innerHTML='';
  const v=items.filter(i=>filter==='all'||i.dir===filter);
  if(loadErr||!v.length){const d=document.createElement('div');d.className='empty';d.textContent=loadErr?t('loadErr')+loadErr:(acct?t('emptyN'):t('emptyC'));L.append(d);return}
  for(const i of v){
    const el=document.createElement('article');el.className='item '+i.dir;
    const top=document.createElement('div');top.className='top';
    const who=document.createElement('span');who.append(i.dir==='in'?t('from'):t('to'));
    const b=document.createElement('b');b.textContent=short(i.peers[0])+(i.peers.length>1?' +'+(i.peers.length-1):'');b.title=i.peers.join('\n');who.append(b);
    const dt=document.createElement('span');dt.textContent=new Date(i.ts).toLocaleString(LOC[lang],{dateStyle:'medium',timeStyle:'short'});
    top.append(who,dt);
    const p=document.createElement('p');p.className='txt';p.textContent=i.text;
    const a=document.createElement('a');a.href=EXP[$('net').value]+'/transactions/'+i.tx;a.target='_blank';a.rel='noopener';a.textContent=t('expl');
    el.append(top,p,a);L.append(el);
  }
}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{filter=x.dataset.f;document.querySelectorAll('.tab').forEach(y=>y.setAttribute('aria-selected',y===x));render()});
$('refresh').onclick=()=>acct&&load();

$('send').onclick=async()=>{
  const r=recips(),m=$('msg').value.trim();$('send').disabled=true;say(t('confirm'));
  try{
    const res=await wallet.signAndSubmitTransferTx({signerAddress:acct.address,signerKeyType:acct.keyType,
      destinations:r.map(a=>({address:a,attoAlphAmount:DUST,message:toHex(m)}))});
    const a=document.createElement('a');a.href=EXP[$('net').value]+'/transactions/'+res.txId;a.target='_blank';a.rel='noopener';a.textContent=t('viewTx');
    const f=document.createElement('span');f.append(t('sentOk'),a);say(f,'ok');
    $('msg').value='';refreshForm();setTimeout(()=>acct&&load(),25000);
  }catch(e){say(t('sendFail')+(e.message||e),'err');refreshForm()}
};
applyLang();
</script>
</body>
</html>
